# =============================================================================
# 고객 IP 복원 — AADC-POC.md 3-2 / 5-2절
#
# DMZ FortiADC 를 신뢰 대상으로 등록한다. 이것이 없으면 모든 로그가
# FortiADC IP(10.3.10.241 / 10.7.10.241)로 찍힌다.
#
# ★ 전제: DMZ FortiADC 가 X-Forwarded-For 를 삽입해야 한다 (Viettel 요청 항목).
#   삽입이 없으면 여기서 복원할 원본이 애초에 없다. 서버에서 고칠 수 없다.
#   판정: R5 에서 client_ip 가 10.3.10.241 로 나오면 FortiADC 설정 누락이다.
# =============================================================================
set_real_ip_from  10.3.10.241;      # dc-dmz-fortiadc-01
set_real_ip_from  10.7.10.241;      # dr-dmz-fortiadc-01
real_ip_header    X-Forwarded-For;
real_ip_recursive on;
