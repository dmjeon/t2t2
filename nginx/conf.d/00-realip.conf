# =============================================================================
# 고객 IP 복원 — AADC-POC.md 3-2 / 5-2절
#
# DMZ FortiADC 를 신뢰 대상으로 등록한다. 이것이 없으면 모든 로그가
# FortiADC 주소로 찍힌다.
#
# ★ FortiADC 는 주소를 한 개만 쓰지 않는다 (2026-09-21 확인).
#   VM 목록에는 `.241` 하나뿐인데, WEB 에 실제로 도착한 출발지는
#   `10.3.10.240` / `10.3.10.242` / `10.7.10.240` 이었다.
#   `.241` 만 적어 두었다가 헬스체크가 403 으로 막혔다 — GSLB.md §0-3 참조.
#   목록은 config.env 의 DMZ_ADC_DC500 / DMZ_ADC_DC400 에서 온다.
#
# ★ 전제: DMZ FortiADC 가 X-Forwarded-For 를 삽입해야 한다 (Viettel 요청 항목).
#   삽입이 없으면 여기서 복원할 원본이 애초에 없다. 서버에서 고칠 수 없다.
#   판정: R5 에서 client_ip 가 FortiADC 주소로 나오면 FortiADC 설정 누락이다.
# =============================================================================
__REALIP_LINES__
real_ip_header    X-Forwarded-For;
real_ip_recursive on;
