# =============================================================================
# /etc/nginx/nginx.conf — WEB-DC1 / WEB-DC2 공통 (Rocky Linux)
# AADC-POC.md 3-2절
# =============================================================================
user  nginx;
worker_processes  auto;

# worker_connections(4096) 보다 커야 한다. 없으면 기본 RLIMIT_NOFILE 1024 에
# 묶여 error.log 에 다음 경고가 뜨고, 실제 동시 처리량이 설정값의 1/4 로
# 잘린다 — 설정은 4096 인데 서버는 1024 에서 막히는 상태가 된다.
#   "4096 worker_connections exceed open file resource limit: 1024"
# 리버스 프록시는 커넥션 하나에 소켓 2개(클라이언트 + 업스트림)를 쓰므로
# 여유를 둔다. 4096 x 2 = 8192 + 로그·리스닝 소켓.
# ※ systemd 의 하드 리밋을 넘을 수 없다. 30-web.sh 가 드롭인으로 같이 올린다.
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65;

    # ----- 로그 (AADC-POC.md 3-2절) -----------------------------------------
    # client= 가 고객 IP 로 찍혀야 한다 (R6). FortiADC IP 로 찍히면
    # set_real_ip_from 누락이거나, DMZ FortiADC 의 XFF 삽입이 빠진 것이다(R5).
    # srv=$server_addr — 요청이 **이 서버의 어느 주소로** 들어왔는가.
    # 2NIC 구성(ens192 10.3.11.51 / ens224 10.7.11.51)에서는 이 값이 없으면
    # 앞단이 어느 세그먼트 주소를 겨냥하는지 알 수 없다. DR ADC 가 web1 을
    # 10.3.11.51 로 겨냥하면 응답이 ens224 로 빠져 비대칭이 되는데, nginx 는
    # 200 을 남기고 앞단은 타임아웃을 보는 상태가 된다 — 이 필드가 그 판정을
    # 로그만으로 가능하게 한다 (NETWORK.md 4절).
    log_format aadc '$time_iso8601 rid=$request_id client=$remote_addr '
                    'srv=$server_addr xff="$http_x_forwarded_for" up=$upstream_addr '
                    'urt=$upstream_response_time rt=$request_time status=$status '
                    'host=$host uri="$request_uri" was=$upstream_http_x_was_host '
                    'wasdc=$upstream_http_x_was_dc ver=$upstream_http_x_app_version';

    access_log /var/log/nginx/aadc.log aadc;

    # 헬스체크는 본 로그를 오염시키므로 분리한다.
    # (GSLB 3초 + L4 2초 주기면 하루 수만 줄이 된다)
    log_format health '$time_iso8601 $request_uri client=$remote_addr '
                      'srv=$server_addr up=$upstream_addr '
                      'urt=$upstream_response_time status=$status';

    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript;
    gzip_min_length   1024;

    include /etc/nginx/conf.d/*.conf;
}
