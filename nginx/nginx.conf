# =============================================================================
# /etc/nginx/nginx.conf — WEB-DC1 / WEB-DC2 공통 (Rocky Linux)
# AADC-POC.md 3-2절
# =============================================================================
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65;

    # ----- 로그 (AADC-POC.md 3-2절) -----------------------------------------
    # client= 가 고객 IP 로 찍혀야 한다 (R6). FortiADC IP 로 찍히면
    # set_real_ip_from 누락이거나, DMZ FortiADC 의 XFF 삽입이 빠진 것이다(R5).
    log_format aadc '$time_iso8601 rid=$request_id client=$remote_addr '
                    'xff="$http_x_forwarded_for" up=$upstream_addr '
                    'urt=$upstream_response_time rt=$request_time status=$status '
                    'host=$host uri="$request_uri" was=$upstream_http_x_was_host '
                    'wasdc=$upstream_http_x_was_dc ver=$upstream_http_x_app_version';

    access_log /var/log/nginx/aadc.log aadc;

    # 헬스체크는 본 로그를 오염시키므로 분리한다.
    # (GSLB 3초 + L4 2초 주기면 하루 수만 줄이 된다)
    log_format health '$time_iso8601 $request_uri up=$upstream_addr '
                      'urt=$upstream_response_time status=$status';

    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript;
    gzip_min_length   1024;

    include /etc/nginx/conf.d/*.conf;
}
